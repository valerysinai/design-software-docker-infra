# Load the pre-baked topology on every clean start (HU-NOTIF-004).
# This ensures notification-service.events is declared with x-dead-letter-exchange
# BEFORE the notification-worker connects, so QueueDeclare is idempotent.
# NOTE: if RabbitMQ already has the queue without the DLX arg, restart with
# a clean volume:  docker compose -p ds-dev down -v  then  up rabbitmq
management.load_definitions = /etc/rabbitmq/definitions.json
